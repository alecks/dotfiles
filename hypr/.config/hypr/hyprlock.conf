general {
    grace = 3
    hide_cursor = true
    no_fade_in = true
    no_fade_out = true
    ignore_empty_input = false
    immediate_render = true
}

background {
    monitor =
    path =
    color = rgba(2D353Bff)

    blur_passes = 2
    blur_size = 1
    noise = 0.0117
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = rgba(D3C6AAff)
    font_size = 72
    font_family = Berkeley Mono

    position = 0, 80
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:3600000] echo "$(date +'%A, %B %d')"
    color = rgba(859289ff)
    font_size = 18
    font_family = Berkeley Mono

    position = 0, 20
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    color = rgba(A7C080ff)
    font_size = 16
    font_family = Berkeley Mono

    position = 0, -60
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 280, 46

    outline_thickness = 2

    roundness = 14

    outer_color = rgba(3D484Dff)
    inner_color = rgba(2D353Bee)
    font_color = rgba(D3C6AAff)

    # Fade between states
    check_color = rgba(A7C080ff)
    fail_color = rgba(E67E80ff)
    fail_text = <i>$FAIL</i>
    fail_timeout = 2000

    placeholder_text = <i>password</i>
    placeholder_color = rgba(5C6A72ff)

    hide_input = false

    position = 0, -120
    halign = center
    valign = center

    shadow = 1
    shadow_color = rgba(00000066)
}

label {
    monitor =
    text = ↵ to unlock
    color = rgba(5C6A72ff)
    font_size = 12
    font_family = Berkeley Mono

    position = 0, 40
    halign = center
    valign = bottom
}
