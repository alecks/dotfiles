# Kanso Ink — https://github.com/webhooked/kanso.nvim
general {
    grace = 3
    hide_cursor = true
    no_fade_in = true
    no_fade_out = true
    ignore_empty_input = false
    immediate_render = true
}

background {
    monitor =
    path =
    color = rgba(1F1F26ff)

    blur_passes = 2
    blur_size = 1
    noise = 0.0117
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = rgba(C5C9C7ff)
    font_size = 72
    font_family = Berkeley Mono

    position = 0, 80
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:3600000] echo "$(date +'%A, %B %d')"
    color = rgba(A4A7A4ff)
    font_size = 18
    font_family = Berkeley Mono

    position = 0, 20
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    color = rgba(8BA4B0ff)
    font_size = 16
    font_family = Berkeley Mono

    position = 0, -60
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 280, 46

    outline_thickness = 2

    roundness = 14

    outer_color = rgba(393B44ff)
    inner_color = rgba(1F1F26ee)
    font_color = rgba(C5C9C7ff)

    # Fade between states
    check_color = rgba(8BA4B0ff)
    fail_color = rgba(C34043ff)
    fail_text = <i>$FAIL</i>
    fail_timeout = 2000

    placeholder_text = <i>password</i>
    placeholder_color = rgba(717C7Cff)

    hide_input = false

    position = 0, -120
    halign = center
    valign = center

    shadow = 1
    shadow_color = rgba(00000066)
}

label {
    monitor =
    text = ↵ to unlock
    color = rgba(717C7Cff)
    font_size = 12
    font_family = Berkeley Mono

    position = 0, 40
    halign = center
    valign = bottom
}
