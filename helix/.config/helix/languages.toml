[[language]]
name = "markdown"
auto-format = true
soft-wrap.enable = true
language-servers = ["markdown-oxide"]
formatter = { command = "npx", args = ["--no-install", "prettier", "--stdin-filepath", "%{buffer_name}"] }

[language-server.texlab]
command = "texlab"

# onSave doesn't seem to work with Helix. Use C-b in config.toml instead.
[language-server.texlab.config.build]
executable = "pdflatex"
args = ["-interaction=nonstopmode", "-output-directory=out", "%f"]
onSave = false
auxDirectory = "out"

[language-server.texlab.config.chktex]
onOpenAndSave = true
onEdit = true

[[language]]
name = "latex"
language-servers = ["texlab"]
soft-wrap.enable = true

[[language]]
name = "c"
auto-format = true

[[language]]
name = "html"
formatter = { command = "npx", args = ["--no-install", "prettier", "--stdin-filepath", "%{buffer_name}"] }
auto-format = true

[[language]]
name = "nunjucks"
formatter = { command = "dprint", args = ["fmt", "--stdin", "html"] }
auto-format = true

[[language]]
name = "json"
formatter = { command = "npx", args = ["--no-install", "prettier", "--stdin-filepath", "%{buffer_name}"] }
auto-format = true

[[language]]
name = "jsonc"
formatter = { command = "npx", args = ["--no-install", "prettier", "--stdin-filepath", "%{buffer_name}"] }
auto-format = true

[[language]]
name = "javascript"
formatter = { command = "npx", args = ["--no-install", "prettier", "--stdin-filepath", "%{buffer_name}"] }
auto-format = true

[[language]]
name = "typescript"
formatter = { command = "npx", args = ["--no-install", "prettier", "--stdin-filepath", "%{buffer_name}"] }
auto-format = true

[[language]]
name = "tsx"
formatter = { command = "npx", args = ["--no-install", "prettier", "--stdin-filepath", "%{buffer_name}"] }
auto-format = true

[[language]]
name = "python"
auto-format = true

[[language]]
name = "go"
formatter = { command = "golines", args = ["--max-len=100", "--base-formatter=gofumpt"] }
auto-format = true
language-servers = ["gopls"]

[[language]]
name = "common-lisp"
file-types = ["pddl"]
